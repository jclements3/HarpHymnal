<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HarpHymnal — SATB → Pedal-Harp arranger</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- abc2svg + playback (vendored) -->
  <script src="/static/vendor/abc2svg-1.js"></script>
  <script src="/static/vendor/toaudio-1.js"></script>
  <script src="/static/vendor/play-1.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>HarpHymnal — SATB &rarr; Pedal-Harp arranger</h1>
    <div class="controls">
      <label>Hymn:
        <input id="hymn-input" list="hymn-list"
               placeholder="type number or title…" autocomplete="off">
        <datalist id="hymn-list"></datalist>
      </label>
      <label>LH Pattern:
        <select id="pattern-select">
          <option value="">— SATB (no pattern) —</option>
        </select>
      </label>
      <button id="arrange-btn">Arrange &#9654;</button>
      <button id="play-btn">Play &#9654;</button>
      <button id="stop-btn">Stop</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <main class="grid">
    <section class="pane">
      <h2>ABC source</h2>
      <textarea id="abc-source" spellcheck="false" placeholder="ABC will appear here after Arrange."></textarea>
    </section>
    <section class="pane">
      <h2>Rendered score</h2>
      <div id="score"></div>
    </section>
  </main>

  <section class="audits">
    <h2>Audits</h2>
    <table id="audits-table">
      <thead><tr><th>Beat</th><th>Severity</th><th>Message</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Hidden audio element used as the fallback MIDI player -->
  <audio id="midi-audio" controls style="display:none"></audio>

  <script src="/static/app.js"></script>
</body>
</html>
