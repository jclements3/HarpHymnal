<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HarpHymnal — SATB → Pedal-Harp Arranger</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/abc2svg-1.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="home-btn" class="btn btn-secondary">&larr; Home</button>
    <h1>Harp Arranger</h1>
    <span id="status" class="status"></span>
  </header>

  <section class="controls">
    <label class="ctl">
      <span>Hymn</span>
      <input id="hymn-input" list="hymn-list" inputmode="search"
             placeholder="type number or title…" autocomplete="off">
      <datalist id="hymn-list"></datalist>
    </label>
    <label class="ctl">
      <span>LH Pattern</span>
      <select id="pattern-select">
        <option value="__default__">— SATB (no pattern) —</option>
      </select>
    </label>
    <button id="prev-btn"  class="btn btn-secondary">&laquo;</button>
    <button id="next-btn"  class="btn btn-secondary">&raquo;</button>
    <button id="compose-btn" class="btn">Open in Composer &rarr;</button>
  </section>

  <main class="grid">
    <section class="pane pane-score">
      <h2>Rendered score</h2>
      <div id="score"></div>
    </section>
    <section class="pane pane-source">
      <h2>ABC source</h2>
      <textarea id="abc-source" spellcheck="false" readonly></textarea>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
