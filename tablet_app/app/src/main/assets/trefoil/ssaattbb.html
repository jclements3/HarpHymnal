<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Harp Score</title>
<script src="vendor/abcjs-basic-min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.abcr { fill: #2563eb !important; fill-opacity: 0; }

/* Harp print: one grand staff per page-row, never split a system across pages. */
#score-container > div { break-inside: avoid; page-break-inside: avoid; }
@media print {
  @page { size: letter landscape; margin: 0.4in; }
  #score-container > div { break-inside: avoid; page-break-inside: avoid; margin: 0 auto 6px; }
}
body { font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; }

/* Top bar */
#topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: #fff; border-bottom: 2px solid #ccc;
  flex-shrink: 0;
}
#title { font-size: 16px; font-weight: bold; color: #2a2a2a; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctrl-btn {
  font-size: 14px; padding: 6px 14px; border: 2px solid #ccc;
  border-radius: 8px; background: #fff; color: #444; cursor: pointer;
}
.ctrl-btn:active { background: #dbeafe; }
.ctrl-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
#key-info { font-size: 13px; color: #888; }

/* Score area */
#score-area {
  height: 40vh; overflow: hidden; position: relative;
  background: #fff; border-bottom: 2px solid #ccc;
  flex-shrink: 0;
}
#score-container {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
}
#playhead-glow {
  position: absolute; top: 0; bottom: 0; width: 6px;
  background: rgba(37, 99, 235, 0.25); z-index: 50;
  pointer-events: none;
}
#playhead-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: #2563eb; z-index: 51;
  pointer-events: none;
}

/* Library */
#library { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; }
#lib-search {
  padding: 10px 14px; font-size: 16px; outline: none; background: #f8f8f8;
}
#lib-search::placeholder { color: #aaa; }
#lib-tabs { display: flex; border-bottom: 2px solid #ddd; background: #f0f4ff; }
.lib-tab {
  flex: 1; text-align: center; padding: 12px 8px;
  font-size: 15px; font-weight: bold; color: #666; cursor: pointer;
  border-bottom: 3px solid transparent;
}
.lib-tab.active { color: #2563eb; border-bottom-color: #2563eb; background: #fff; }
.lib-panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
.lib-panel.active { display: flex; }
#key-filters {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 6px 10px; background: #f0f4ff; border-bottom: 1px solid #ddd;
}
.key-btn {
  font-size: 13px; padding: 4px 10px; border: 1.5px solid #ccc;
  border-radius: 6px; background: #fff; color: #444; cursor: pointer;
}
.key-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
#hymn-cols { flex: 1; display: flex; min-height: 0; }
.hymn-col { flex: 1; overflow-y: auto; border-right: 1px solid #eee; }
.hymn-col:last-child { border-right: none; }
#drill-list { flex: 1; overflow-y: auto; display: flex; min-height: 0; }
.lib-item {
  padding: 10px; font-size: 13px; color: #2a2a2a;
  border-bottom: 1px solid #eee; cursor: pointer;
}
.lib-item:active { background: #dbeafe; }
.lib-item.active { background: #dbeafe; font-weight: bold; }
.letter-header {
  padding: 10px 12px; font-size: 15px; font-weight: bold;
  color: #2563eb; background: #f0f4ff; border-bottom: 1px solid #ddd; cursor: pointer;
}
.letter-header.collapsed::after { content: ' +'; color: #999; }
.letter-header:not(.collapsed)::after { content: ' \2212'; color: #999; }
.letter-items.hidden { display: none; }
</style>
</head>
<body>

<div id="topbar">
  <span id="title">Harp Score</span>
  <button class="ctrl-btn" id="btn-rewind" onclick="rewind()">|&lt;&lt;</button>
  <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">Play</button>
  <button class="ctrl-btn" id="btn-prev" onclick="navHymn(-1)">&lt; Prev</button>
  <button class="ctrl-btn" id="btn-next" onclick="navHymn(1)">Next &gt;</button>
  <button class="ctrl-btn active" id="btn-mel" onclick="toggleMelody()">Melody</button>
  <label style="font-size:13px;color:#888;">BPM:</label>
  <input type="range" id="bpm-slider" min="20" max="240" value="80" style="width:80px;vertical-align:middle;"/>
  <span id="bpm-val" style="font-size:14px;font-weight:bold;min-width:28px;">80</span>
  <button class="ctrl-btn" id="btn-mute" onclick="toggleMute()">Mute</button>
  <label style="font-size:13px;color:#888;">Vol:</label>
  <input type="range" id="vol-slider" min="0" max="100" value="50" style="width:80px;vertical-align:middle;"/>
  <span id="vol-label" style="font-size:11px;color:#888;min-width:18px;">50</span>
  <span id="key-info"></span>
</div>

<div id="score-area">
  <div id="score-container"></div>
  <div id="playhead-glow"></div>
  <div id="playhead-line"></div>
</div>

<div id="library">
  <div style="display:flex;gap:8px;padding:0;">
    <input type="text" id="lib-search" placeholder="Search..." style="flex:1;border-right:1px solid #ddd;"/>
    <select id="recent-select" style="flex:1;font-size:14px;padding:8px 10px;border:none;border-bottom:1px solid #ddd;background:#f8f8f8;outline:none;">
      <option value="">Recent...</option>
    </select>
  </div>
  <div id="lib-tabs">
    <div class="lib-tab active" data-panel="hymn-panel">Hymns</div>
    <div class="lib-tab" data-panel="drill-panel">Drills</div>
  </div>
  <div id="hymn-panel" class="lib-panel active">
    <div id="key-filters">
      <span style="font-size:12px;color:#888;align-self:center;">Key:</span>
      <button class="key-btn active" data-key="All">All</button>
      <button class="key-btn" data-key="Eb">Eb</button>
      <button class="key-btn" data-key="Bb">Bb</button>
      <button class="key-btn" data-key="F">F</button>
      <button class="key-btn" data-key="C">C</button>
      <button class="key-btn" data-key="G">G</button>
      <button class="key-btn" data-key="D">D</button>
      <button class="key-btn" data-key="A">A</button>
      <button class="key-btn" data-key="E">E</button>
    </div>
    <div id="hymn-cols">
      <div id="hymn-col-left" class="hymn-col"></div>
      <div id="hymn-col-right" class="hymn-col"></div>
    </div>
  </div>
  <div id="drill-panel" class="lib-panel">
    <div id="drill-list">
      <div id="drill-col-left" class="hymn-col"></div>
      <div id="drill-col-right" class="hymn-col"></div>
    </div>
  </div>
</div>

<script>
var DATA = [], DRILLS = [], currentIdx = -1, isDrill = false;
var recentItems = JSON.parse(localStorage.getItem('harpRecent') || '[]');  // [{type:'hymn'|'drill', idx:N, title:str}]
var playing = false;
var melodyOn = true, activeKey = 'All';
var bpm = 80;
var svgScale = 1, scrollX = 0, animId = null;
var playStartTime = 0, playStartX = 0, playEndX = 0, playTotalDuration = 0;

var $area = null, $container = null, $phGlow = null, $phLine = null;

// ── Grand-staff alignment helpers (from hymnal/HarpHymnal.html + shape-chords-eb.html) ──
// These self-noop on single-staff output, so calling them after every render is safe.
function shiftPathY(d, yFn) {
  const tokens = [];
  const re = /([MmLlHhVvCcSsQqTtAaZz])|(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)/g;
  let mm;
  while ((mm = re.exec(d)) !== null) tokens.push(mm[1] || mm[2]);
  const out = [];
  let i = 0, prevCmd = '';
  while (i < tokens.length) {
    const tok = tokens[i];
    if (/^[A-Za-z]$/.test(tok)) { out.push(tok); prevCmd = tok; i++; continue; }
    const cmd = prevCmd.toUpperCase();
    const isAbs = prevCmd === cmd;
    let stride, yIdxs;
    switch (cmd) {
      case 'M': case 'L': case 'T': stride = 2; yIdxs = [1]; break;
      case 'H': stride = 1; yIdxs = []; break;
      case 'V': stride = 1; yIdxs = [0]; break;
      case 'C': stride = 6; yIdxs = [1,3,5]; break;
      case 'S': case 'Q': stride = 4; yIdxs = [1,3]; break;
      case 'A': stride = 7; yIdxs = [6]; break;
      default: stride = 2; yIdxs = []; break;
    }
    const args = tokens.slice(i, i + stride).map(Number);
    if (args.length !== stride) break;
    if (isAbs) yIdxs.forEach(yi => { args[yi] = yFn(args[yi]); });
    args.forEach(n => out.push(+n.toFixed(4)));
    i += stride;
    if (prevCmd === 'M') prevCmd = 'L';
    else if (prevCmd === 'm') prevCmd = 'l';
  }
  return out.join(' ');
}

function alignMiddleC(scoreEl) {
  scoreEl.querySelectorAll('svg').forEach(svg => {
    const isStaffLinePath = p => {
      const d = p.getAttribute('d') || '';
      const m = d.match(/^M\s+\d+(?:\.\d+)?\s+(\d+(?:\.\d+)?)\s+L\s+\d+(?:\.\d+)?\s+(\d+(?:\.\d+)?)\s+L\s+\d+(?:\.\d+)?\s+(\d+(?:\.\d+)?)/);
      if (!m) return false;
      const y1 = +m[1], y2 = +m[2], y3 = +m[3];
      return y1 === y2 && Math.abs(y3 - y1) < 1.5;
    };
    const lineGroups = [];
    svg.querySelectorAll('g').forEach(g => {
      const ps = Array.from(g.children).filter(c => c.tagName.toLowerCase() === 'path');
      if (ps.length === 5 && ps.every(isStaffLinePath)) lineGroups.push(g);
    });
    if (lineGroups.length < 2) return;
    const yOf = p => parseFloat((p.getAttribute('d').match(/^M\s+\d+(?:\.\d+)?\s+(\d+(?:\.\d+)?)/) || [])[1]);
    const NS = 'http://www.w3.org/2000/svg';
    let totalDelta = 0;
    const firstLineD = lineGroups[0].children[0].getAttribute('d') || '';
    const staffOriginX = parseFloat((firstLineD.match(/^M\s+(\d+(?:\.\d+)?)/) || [])[1]) || 25;
    const matchVerticalRect = d => {
      const m = d.match(/^M\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s*L\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s*L\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s*L\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)/);
      if (!m) return null;
      const x1 = +m[1], y1 = +m[2], x2 = +m[3], y2 = +m[4], x3 = +m[5];
      if (x1 !== x2 || Math.abs(x3 - x1) > 5) return null;
      return { x: x1, y1, y2, width: Math.abs(x3 - x1) };
    };
    const isStartBarline = p => {
      const r = matchVerticalRect(p.getAttribute('d') || '');
      if (!r) return false;
      return Math.abs(r.x - staffOriginX) < 2 && Math.abs(r.y2 - r.y1) > 30;
    };
    const thicken = (p, newWidth) => {
      const r = matchVerticalRect(p.getAttribute('d') || '');
      if (!r) return;
      const yt = Math.min(r.y1, r.y2), yb = Math.max(r.y1, r.y2);
      p.setAttribute('d',
        'M ' + r.x + ' ' + yb + ' L ' + r.x + ' ' + yt +
        ' L ' + (r.x + newWidth) + ' ' + yt +
        ' L ' + (r.x + newWidth) + ' ' + yb + ' z');
    };
    const jobs = [];
    for (let i = 0; i + 1 < lineGroups.length; i += 2) {
      const trebleLG = lineGroups[i], bassLG = lineGroups[i + 1];
      const parent = bassLG.parentNode;
      const siblings = Array.from(parent.children);
      const startIdx = siblings.indexOf(bassLG);
      let endIdx = siblings.length;
      if (i + 2 < lineGroups.length) {
        const nextTreble = lineGroups[i + 2];
        if (nextTreble.parentNode === parent) {
          const nIdx = siblings.indexOf(nextTreble);
          if (nIdx > startIdx) endIdx = nIdx;
        }
      }
      const toWrap = siblings.slice(startIdx, endIdx);
      const insertAt = siblings[endIdx] || null;
      const trebleYs = Array.from(trebleLG.children).map(yOf).filter(y => !isNaN(y)).sort((a,b)=>a-b);
      const bassYs   = Array.from(bassLG.children).map(yOf).filter(y => !isNaN(y)).sort((a,b)=>a-b);
      if (trebleYs.length < 5 || bassYs.length < 5) continue;
      const trebleBot = trebleYs[4], bassTop = bassYs[0];
      const lineSpacing = trebleYs[1] - trebleYs[0];
      const delta = (bassTop - trebleBot) - 2 * lineSpacing;
      if (delta < 0.01) continue;
      jobs.push({ parent, toWrap, insertAt, delta, threshold: (trebleBot + bassTop) / 2, trebleBot, bassTop });
    }
    const wrappers = [];
    jobs.forEach(job => {
      const toWrap = [];
      job.toWrap.forEach(el => {
        const dn = (el.getAttribute && el.getAttribute('data-name') || '').toLowerCase();
        if (dn === 'bar') {
          el.querySelectorAll('path').forEach(p => {
            const d = p.getAttribute('d') || '';
            p.setAttribute('d', shiftPathY(d, y => y >= job.threshold ? y - job.delta : y));
          });
          return;
        }
        if (el.tagName.toLowerCase() === 'path' && isStartBarline(el)) {
          thicken(el, 1.8);
          return;
        }
        toWrap.push(el);
      });
      const wrapper = svg.ownerDocument.createElementNS(NS, 'g');
      wrapper.setAttribute('transform', 'translate(0, ' + (-job.delta).toFixed(3) + ')');
      toWrap.forEach(el => wrapper.appendChild(el));
      job.parent.insertBefore(wrapper, job.insertAt);
      wrappers.push(wrapper);
      totalDelta += job.delta;
    });
    svg.querySelectorAll('path').forEach(p => {
      for (const w of wrappers) {
        let a = p.parentNode;
        while (a) { if (a === w) return; a = a.parentNode; }
      }
      let anc = p.parentNode;
      while (anc && anc.getAttribute) {
        if ((anc.getAttribute('data-name') || '').toLowerCase() === 'bar') return;
        anc = anc.parentNode;
      }
      const d = p.getAttribute('d') || '';
      const nums = (d.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      if (!nums.length) return;
      const xs = [], ys = [];
      for (let i = 0; i < nums.length; i += 2) { xs.push(nums[i]); ys.push(nums[i + 1]); }
      const xmin = Math.min(...xs), xmax = Math.max(...xs);
      const ymin = Math.min(...ys), ymax = Math.max(...ys);
      const isBrace = /[Cc]/.test(d) && xmin < staffOriginX - 2 && xmax < staffOriginX + 12;
      const isStartBar = !isBrace && (xmax - xmin) < 5 && Math.abs(xmin - staffOriginX) < 2 && (ymax - ymin) > 30;
      if (!isBrace && !isStartBar) return;
      for (const job of jobs) {
        if (ymin < job.threshold && ymax >= job.threshold
            && ymin > job.trebleBot - 100 && ymax < job.bassTop + 400) {
          if (isBrace) {
            const yRange = ymax - ymin;
            const scaleY = yRange > 0.01 ? (yRange - job.delta) / yRange : 1;
            p.setAttribute('transform',
              'translate(' + (staffOriginX - 2).toFixed(3) + ',' + ymin.toFixed(3) + ')'
              + ' scale(0.5,' + scaleY.toFixed(5) + ')'
              + ' translate(' + (-staffOriginX).toFixed(3) + ',' + (-ymin).toFixed(3) + ')');
          } else {
            p.setAttribute('d', shiftPathY(d, y => y >= job.threshold ? y - job.delta : y));
          }
          return;
        }
      }
    });
    const lastDelta = jobs.length > 0 ? jobs[jobs.length - 1].delta : 0;
    if (lastDelta > 0) {
      const h = parseFloat(svg.getAttribute('height') || '0');
      if (h > 0) svg.setAttribute('height', (h - lastDelta).toFixed(3));
      const vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
      if (vb.length === 4 && !isNaN(vb[3])) {
        vb[3] -= lastDelta;
        svg.setAttribute('viewBox', vb.join(' '));
      }
    }
  });
}

function shiftAbsX(d, dx) {
  const toks = d.match(/[A-Za-z]|-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/g) || [];
  const stride = { M: 2, L: 2, T: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, A: 7, Z: 0 };
  const xIdx = { M: [0], L: [0], T: [0], H: [0], C: [0, 2, 4], S: [0, 2], Q: [0, 2], A: [5] };
  const out = []; let i = 0, cmd = '';
  while (i < toks.length) {
    const t = toks[i];
    if (/[A-Za-z]/.test(t)) { out.push(t); cmd = t; i++; continue; }
    const up = cmd.toUpperCase(); const st = stride[up] || 2;
    const idxs = (cmd === up) ? (xIdx[up] || []) : [];
    const args = toks.slice(i, i + st).map(Number);
    if (args.length < st) { while (i < toks.length) out.push(toks[i++]); break; }
    idxs.forEach(xi => { args[xi] += dx; });
    args.forEach(n => out.push('' + (+n.toFixed(3))));
    i += st;
    if (cmd === 'M') cmd = 'L'; else if (cmd === 'm') cmd = 'l';
  }
  return out.join(' ');
}

function snapSystems(scoreEl) {
  const svgs = Array.prototype.slice.call(scoreEl.querySelectorAll('svg'))
    .filter(svg => svg.querySelectorAll('g[data-name="bar"]').length >= 7);
  if (svgs.length < 2) return;
  const info = svgs.map(svg => {
    let firstBar = Infinity, maxX = 0;
    svg.querySelectorAll('g[data-name="bar"] > path, path[data-name="bar"]').forEach(p => {
      const mm = (p.getAttribute('d') || '').match(/-?\d+(?:\.\d+)?/);
      if (mm) { const x = +mm[0]; if (x < firstBar) firstBar = x; }
    });
    svg.querySelectorAll('path').forEach(p => {
      const nums = (p.getAttribute('d') || '').match(/-?\d+(?:\.\d+)?/g) || [];
      for (let i = 0; i < nums.length - 1; i += 2) { const x = +nums[i]; if (x > maxX) maxX = x; }
    });
    return { svg, firstBar, maxX };
  });
  const target = Math.max.apply(null, info.map(i => i.firstBar));
  let commonW = 0;
  info.forEach(i => { const r = i.maxX + (target - i.firstBar); if (r > commonW) commonW = r; });
  commonW = Math.ceil(commonW + 16);
  info.forEach(i => {
    const dx = target - i.firstBar;
    if (Math.abs(dx) > 0.5) {
      i.svg.querySelectorAll('path').forEach(p => p.setAttribute('d', shiftAbsX(p.getAttribute('d'), dx)));
      i.svg.querySelectorAll('text').forEach(t => {
        const x = parseFloat(t.getAttribute('x'));
        if (!isNaN(x)) t.setAttribute('x', x + dx);
        t.querySelectorAll('tspan').forEach(ts => {
          const tx = parseFloat(ts.getAttribute('x'));
          if (!isNaN(tx)) ts.setAttribute('x', tx + dx);
        });
      });
    }
    const vb = (i.svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
    const minY = vb.length === 4 ? vb[1] : 0, h = vb.length === 4 ? vb[3] : 100;
    i.svg.setAttribute('viewBox', '0 ' + minY + ' ' + commonW + ' ' + h);
  });
}

function getPlayheadX() { return $area.offsetWidth * 0.05; }

function setScroll(x) {
  scrollX = x;
  $container.style.transform = 'translateX(' + x + 'px)';
}

function animateScroll(now) {
  if (!now) now = performance.now();
  var t = 1.0;
  if (playTotalDuration > 0) {
    var elapsed = now - playStartTime;
    t = Math.min(elapsed / playTotalDuration, 1.0);
    setScroll(playStartX + (playEndX - playStartX) * t);
  }
  if (playing && t < 1.0) {
    animId = requestAnimationFrame(animateScroll);
  } else if (playing) {
    // Scroll reached the end — stop audio + reset transport.
    playing = false;
    if (synthControl) { try { synthControl.pause(); } catch (e) {} }
    updatePlayBtn();
    stopScrollAnim();
  }
}

function startScrollAnim() {
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(animateScroll);
}

function stopScrollAnim() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function positionPlayhead() {
  var px = getPlayheadX();
  $phGlow.style.left = (px - 2) + 'px';
  $phLine.style.left = px + 'px';
}

// ── Init DOM refs ──
$area = document.getElementById('score-area');
$container = document.getElementById('score-container');
$phGlow = document.getElementById('playhead-glow');
$phLine = document.getElementById('playhead-line');
positionPlayhead();

// ── Load data ──
function init() {
  Promise.all([
    fetch('ssaattbb_data.json?v=' + Date.now()).then(function(r) { return r.json(); }),
    fetch('pattern_drills.json?v=' + Date.now()).then(function(r) { return r.json(); })
  ]).then(function(results) {
    DATA = results[0];
    DRILLS = results[1] || [];
    buildLibrary();
    buildDrillList();
    if (DATA.length > 0) selectHymn(0);
  });
}

// ── Library ──
function buildLibrary() {
  var hymns = DATA.filter(function(h) { return h.n >= 4000 || h.n >= 1; });
  var drills = [];
  var hymnItems = [];

  // Separate drills (n < 4000) from hymns (n >= 4000)
  // In ssaattbb_data, all are hymns from OpenHymnal
  DATA.forEach(function(h, i) { hymnItems.push({h: h, idx: i}); });

  buildHymnCols(hymnItems);
}

function buildHymnCols(items) {
  var $left = document.getElementById('hymn-col-left');
  var $right = document.getElementById('hymn-col-right');
  $left.innerHTML = ''; $right.innerHTML = '';

  // Group by first letter
  var letters = {};
  items.forEach(function(item) {
    var title = item.h.t.replace(/^\d+\s*/, '');
    var letter = title.charAt(0).toUpperCase();
    if (!letters[letter]) letters[letter] = [];
    letters[letter].push(item);
  });

  var sortedLetters = Object.keys(letters).sort();
  var half = Math.ceil(sortedLetters.length / 2);

  function buildCol(col, letterList) {
    letterList.forEach(function(letter) {
      var hdr = document.createElement('div');
      hdr.className = 'letter-header collapsed';
      hdr.textContent = letter;
      hdr.onclick = function() {
        hdr.classList.toggle('collapsed');
        var items = hdr.nextElementSibling;
        items.classList.toggle('hidden');
      };
      col.appendChild(hdr);

      var itemsDiv = document.createElement('div');
      itemsDiv.className = 'letter-items hidden';
      letters[letter].forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'lib-item';
        div.setAttribute('data-idx', item.idx);
        div.textContent = item.h.t;
        div.onclick = function() { selectHymn(item.idx); };
        itemsDiv.appendChild(div);
      });
      col.appendChild(itemsDiv);
    });
  }

  buildCol($left, sortedLetters.slice(0, half));
  buildCol($right, sortedLetters.slice(half));
}

function addRecent(type, idx, title) {
  // Remove if already in list
  recentItems = recentItems.filter(function(r) { return !(r.type === type && r.idx === idx); });
  // Add to front
  recentItems.unshift({type: type, idx: idx, title: title});
  // Keep max 20
  if (recentItems.length > 20) recentItems = recentItems.slice(0, 20);
  localStorage.setItem('harpRecent', JSON.stringify(recentItems));
  updateRecentDropdown();
}

function updateRecentDropdown() {
  var sel = document.getElementById('recent-select');
  sel.innerHTML = '<option value="">Recent...</option>';
  recentItems.forEach(function(r, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = r.title;
    sel.appendChild(opt);
  });
}

function buildDrillList() {
  var $left = document.getElementById('drill-col-left');
  var $right = document.getElementById('drill-col-right');
  $left.innerHTML = ''; $right.innerHTML = '';

  // Group drills by hand + shape name (e.g. "RH 3rd+3rd", "LH 3rd+4th+5th")
  var groups = {};
  DRILLS.forEach(function(d, i) {
    // Extract group: "RH 3rd+3rd from C" -> "RH 3rd+3rd"
    var parts = d.t.split(' from ');
    var group = parts[0];
    if (!groups[group]) groups[group] = [];
    groups[group].push({d: d, idx: i});
  });

  var groupNames = Object.keys(groups);
  // Split: RH groups in left col, LH in right
  var rhGroups = groupNames.filter(function(g) { return g.indexOf('RH') === 0; });
  var lhGroups = groupNames.filter(function(g) { return g.indexOf('LH') === 0; });

  function buildGroupCol(col, groupList) {
    groupList.forEach(function(groupName) {
      var hdr = document.createElement('div');
      hdr.className = 'letter-header collapsed';
      hdr.textContent = groupName;
      hdr.onclick = function() {
        hdr.classList.toggle('collapsed');
        hdr.nextElementSibling.classList.toggle('hidden');
      };
      col.appendChild(hdr);

      var itemsDiv = document.createElement('div');
      itemsDiv.className = 'letter-items hidden';
      groups[groupName].forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'lib-item';
        div.setAttribute('data-drill-idx', item.idx);
        // Show just the starting note
        var fromPart = item.d.t.split(' from ')[1] || item.d.t;
        div.textContent = 'from ' + fromPart;
        div.onclick = function() { selectDrill(item.idx); };
        itemsDiv.appendChild(div);
      });
      col.appendChild(itemsDiv);
    });
  }

  buildGroupCol($left, rhGroups);
  buildGroupCol($right, lhGroups);
}

function selectDrill(idx) {
  isDrill = true;
  currentIdx = idx;
  var d = DRILLS[idx];
  document.getElementById('title').textContent = d.t;
  document.getElementById('key-info').textContent = 'Key: ' + d.key;

  document.querySelectorAll('.lib-item').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('[data-drill-idx="' + idx + '"]').forEach(function(el) { el.classList.add('active'); });

  addRecent('drill', idx, d.t);
  renderAbc(d.abc);
}

function filterByKey(key) {
  activeKey = key;
  document.querySelectorAll('.key-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-key') === key);
  });
  var items = [];
  DATA.forEach(function(h, i) {
    if (key === 'All' || h.key === key) items.push({h: h, idx: i});
  });
  buildHymnCols(items);
}

// ── Score rendering ──
function selectHymn(idx) {
  isDrill = false;
  currentIdx = idx;
  var h = DATA[idx];

  document.getElementById('title').textContent = h.t;
  document.getElementById('key-info').textContent = 'Key: ' + h.key;

  document.querySelectorAll('.lib-item').forEach(function(el) {
    el.classList.toggle('active', parseInt(el.getAttribute('data-idx')) === idx);
  });

  addRecent('hymn', idx, h.t);
  renderAbc(getAbc(h));
}

function getAbc(h) {
  var abc = h.abc;
  if (!melodyOn) {
    var lines = abc.split('\n');
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf('[V: M]') === 0) {
        // Replace notes/chords with rests, preserve chord annotations and durations
        var voice = lines[i].replace(/\[V: M\]\s*/, '');
        var result = '[V: M] ';
        var pos = 0;
        while (pos < voice.length) {
          // Chord annotation "^text"
          if (voice[pos] === '"') {
            var end = voice.indexOf('"', pos + 1);
            if (end >= 0) { result += voice.substring(pos, end + 1); pos = end + 1; continue; }
          }
          // ABC chord [notes]duration
          if (voice[pos] === '[' && voice[pos+1] !== 'V') {
            var cb = voice.indexOf(']', pos);
            if (cb >= 0) {
              pos = cb + 1;
              // grab duration after ]
              var dm = voice.substring(pos).match(/^(\d*(?:\/\d*)?)/);
              var dur = dm ? dm[1] : '';
              pos += dur.length;
              result += 'z' + dur;
              continue;
            }
          }
          // Single note: accidental? letter octave? duration?
          var nm = voice.substring(pos).match(/^[_^=]*[A-Ga-g][,']*(\d*(?:\/\d*)?)/);
          if (nm) {
            result += 'z' + nm[1];
            pos += nm[0].length;
            continue;
          }
          // Pass through anything else (barlines, spaces, etc)
          result += voice[pos];
          pos++;
        }
        lines[i] = result;
      }
    }
    abc = lines.join('\n');
  }
  return abc;
}

function render() {
  if (currentIdx < 0) return;
  if (isDrill) {
    renderAbc(DRILLS[currentIdx].abc);
  } else {
    renderAbc(getAbc(DATA[currentIdx]));
  }
}

// currentVisualObj holds the abcjs TuneObject (for synth audio + note timing).
var currentVisualObj = null;
function renderAbc(abcText) {
  $container.innerHTML = '';

  if (synthControl && playing) { synthControl.pause(); playing = false; updatePlayBtn(); stopScrollAnim(); }

  // This page is a continuous HORIZONTAL strip chart scrolled via translateX:
  // the whole hymn must render as ONE wide SVG on a single line. The fork's
  // %%nowrap directive (already implied by the source's %%continueall) keeps the
  // music on one line; oneSvgPerLine/wrap would stack systems vertically and
  // break the scroll, so they are intentionally omitted here. add_classes gives
  // us .abcjs-note hooks for the scroll-sync overlay rects.
  if (abcText.indexOf('%%nowrap') < 0) {
    abcText = abcText.replace(/^(X:.*\n)/m, '$1%%nowrap 1\n');
  }
  var ret = ABCJS.renderAbc($container, abcText, {
    responsive: 'resize',
    lyricsNoSpacing: true,
    add_classes: true
  });
  currentVisualObj = (ret && ret.length) ? ret[0] : null;

  // Grand-staff alignment helpers (treble V:1 / bass V:2). They self-noop unless
  // a system is exactly a treble+bass PAIR. This page's strip uses 3 staves
  // (melody + RH grand + LH grand) on one continuous line, so they noop here —
  // but the calls are kept for parity with the other harp apps and will engage
  // automatically if a 2-staff drill is ever rendered. try/catch: never break render.
  try { alignMiddleC($container); } catch (e) { console.warn('alignMiddleC:', e); }
  try { snapSystems($container); } catch (e) { console.warn('snapSystems:', e); }

  // Build scroll-sync overlay rects from abcjs note elements. The strip-chart
  // scroll math reads `.abcr` rects (originally emitted by abc2svg's anno_stop);
  // recreate them from abcjs's `.abcjs-note`/`.abcjs-rest` glyph bounding boxes.
  try {
    var notes = $container.querySelectorAll('.abcjs-note, .abcjs-rest');
    var NS = 'http://www.w3.org/2000/svg';
    for (var i = 0; i < notes.length; i++) {
      var el = notes[i];
      var bb;
      try { bb = el.getBBox(); } catch (e) { continue; }
      var svg = el.ownerSVGElement;
      if (!svg) continue;
      var r = svg.ownerDocument.createElementNS(NS, 'rect');
      r.setAttribute('class', 'abcr');
      r.setAttribute('x', bb.x.toFixed(2));
      r.setAttribute('y', bb.y.toFixed(2));
      r.setAttribute('width', Math.max(bb.width, 1).toFixed(2));
      r.setAttribute('height', Math.max(bb.height, 1).toFixed(2));
      el.appendChild(r);
    }
  } catch (e) { console.warn('abcr overlay build:', e); }

  // Position playhead
  positionPlayhead();
  setScroll(getPlayheadX());
}

// ── Playback (abcjsharp fork synth) ──
// SynthController manages its own AudioContext + tempo (setWarp) and exposes
// play()/pause(). It is the proper audio companion to ABCJS.renderAbc, replacing
// abc2svg's AbcPlay. Volume is applied through an AudioContext gain node, since
// this fork build's SynthController has no setVolume().
var synthControl = null;
var synthAudioCtx = null, synthGain = null;

function ensureSynth() {
  if (synthControl) return synthControl;
  synthControl = new ABCJS.synth.SynthController();
  // SynthController.load requires a DOM element to host its (here-hidden)
  // transport widget; create an off-screen one so audio-only playback works.
  var host = document.getElementById('synth-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'synth-host';
    host.style.display = 'none';
    document.body.appendChild(host);
  }
  try {
    synthControl.load('#synth-host', null,
      { displayLoop: false, displayRestart: false, displayPlay: false, displayProgress: false, displayWarp: false });
  } catch (e) { console.warn('synth load:', e); }
  return synthControl;
}

function applySynthVolume() {
  var vol = parseInt(document.getElementById('vol-slider').value) / 100;
  if (synthGain) synthGain.gain.value = vol;
}

function togglePlay() {
  if (!currentVisualObj) return;
  if (playing) {
    if (synthControl) { try { synthControl.pause(); } catch (e) {} }
    playing = false;
    updatePlayBtn();
    stopScrollAnim();
    return;
  }

  // Native BPM from ABC Q: field; user BPM scales playback speed via setWarp.
  var h = DATA[currentIdx];
  var qm = h && h.abc ? h.abc.match(/Q:\s*\d+\/\d+=(\d+)/) : null;
  var nativeBpm = qm ? parseInt(qm[1]) : 80;
  var speedRatio = bpm / nativeBpm;

  // Total duration: abcjs reports getTotalTime() in seconds at the tune tempo.
  var baseSec = (currentVisualObj.getTotalTime && currentVisualObj.getTotalTime()) || 0;
  if (!baseSec) {
    var beats = (currentVisualObj.getTotalBeats && currentVisualObj.getTotalBeats()) || 0;
    baseSec = beats ? (beats * 60 / nativeBpm) : 4;
  }
  playTotalDuration = (baseSec * 1000) / speedRatio;

  // Scroll range from actual note positions (the .abcr rects built at render).
  var allNotes = $container.getElementsByClassName('abcr');
  var cRect = $container.getBoundingClientRect();
  var firstX = allNotes.length > 0 ? (allNotes[0].getBoundingClientRect().left - cRect.left) : 0;
  var lastX = allNotes.length > 0 ? (allNotes[allNotes.length - 1].getBoundingClientRect().left - cRect.left) : firstX + 100;
  var trailPx = allNotes.length > 1 ? ((lastX - firstX) / Math.max(allNotes.length - 1, 1)) * 4 : 0;
  playStartX = getPlayheadX() - firstX;
  playEndX = getPlayheadX() - lastX - trailPx;

  setScroll(playStartX);
  playing = true;
  playStartTime = performance.now();
  updatePlayBtn();
  startScrollAnim();

  if (!ABCJS.synth.supportsAudio()) {
    // No WebAudio (e.g. headless): scroll only, no sound.
    return;
  }
  // Build / reuse an AudioContext + gain so the Vol slider works.
  if (!synthAudioCtx) {
    synthAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    synthGain = synthAudioCtx.createGain();
    synthGain.connect(synthAudioCtx.destination);
    if (ABCJS.synth.registerAudioContext) ABCJS.synth.registerAudioContext(synthAudioCtx);
  }
  if (synthAudioCtx.state === 'suspended') synthAudioCtx.resume();
  applySynthVolume();

  var sc = ensureSynth();
  sc.setTune(currentVisualObj, false, {
    audioContext: synthAudioCtx,
    program: 46,                 // 46 = Orchestral Harp (GM)
    qpm: bpm,                    // play at the user-selected tempo
    onEnded: function () { /* scroll loop owns transport reset */ }
  }).then(function () {
    if (sc.setWarp) sc.setWarp(Math.round(speedRatio * 100));
    return sc.play();
  }).catch(function (e) { console.warn('synth play failed:', e); });
}

function updatePlayBtn() {
  var btn = document.getElementById('btn-play');
  btn.textContent = playing ? 'Stop' : 'Play';
  btn.classList.toggle('active', playing);
}

function navHymn(dir) {
  // Find visible hymns in current key filter
  var visible = [];
  DATA.forEach(function(h, i) {
    if (activeKey === 'All' || h.key === activeKey) visible.push(i);
  });
  if (visible.length === 0) return;
  var curPos = visible.indexOf(currentIdx);
  if (curPos < 0) curPos = 0;
  var newPos = (curPos + dir + visible.length) % visible.length;
  selectHymn(visible[newPos]);
}

function rewind() {
  if (synthControl && playing) { try { synthControl.pause(); } catch (e) {} playing = false; updatePlayBtn(); stopScrollAnim(); }
  setScroll(playStartX);
}

function toggleMelody() {
  melodyOn = !melodyOn;
  var btn = document.getElementById('btn-mel');
  btn.textContent = melodyOn ? 'Melody' : 'Melody Off';
  btn.classList.toggle('active', melodyOn);
  render();
}

// ── Recent ──
document.getElementById('recent-select').addEventListener('change', function() {
  var idx = parseInt(this.value);
  if (isNaN(idx)) return;
  var r = recentItems[idx];
  if (r.type === 'hymn') selectHymn(r.idx);
  else if (r.type === 'drill') selectDrill(r.idx);
  this.value = '';  // reset to "Recent..."
});
updateRecentDropdown();

// ── Search ──
document.getElementById('lib-search').addEventListener('input', function() {
  var q = this.value.toLowerCase();
  document.querySelectorAll('.lib-item').forEach(function(el) {
    el.style.display = el.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
});

// ── Key filters ──
document.querySelectorAll('.key-btn').forEach(function(btn) {
  btn.onclick = function() { filterByKey(btn.getAttribute('data-key')); };
});

// ── Tab switching ──
document.querySelectorAll('.lib-tab').forEach(function(tab) {
  tab.onclick = function() {
    document.querySelectorAll('.lib-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.lib-panel').forEach(function(p) { p.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById(tab.getAttribute('data-panel')).classList.add('active');
  };
});

var muted = false, savedVol = 50;

function toggleMute() {
  muted = !muted;
  var btn = document.getElementById('btn-mute');
  var slider = document.getElementById('vol-slider');
  if (muted) {
    savedVol = parseInt(slider.value);
    slider.value = 0;
    document.getElementById('vol-label').textContent = '0';
    btn.classList.add('active');
    btn.textContent = 'Unmute';
    if (synthGain) synthGain.gain.value = 0;
  } else {
    slider.value = savedVol;
    document.getElementById('vol-label').textContent = savedVol;
    btn.classList.remove('active');
    btn.textContent = 'Mute';
    if (synthGain) synthGain.gain.value = savedVol / 100;
  }
}

// ── BPM and Volume ──
// BPM rescales scroll speed live; abcjs synth tempo is fixed at start() time, so
// a BPM change mid-playback won't re-pitch audio (matches the strip-chart's
// scroll-is-authoritative model). New tempo applies on next Play.
document.getElementById('bpm-slider').addEventListener('input', function() {
  bpm = parseInt(this.value);
  document.getElementById('bpm-val').textContent = bpm;
});
document.getElementById('vol-slider').addEventListener('input', function() {
  var vol = parseInt(this.value);
  document.getElementById('vol-label').textContent = vol;
  if (synthGain) synthGain.gain.value = vol / 100;
});

// ── Keyboard shortcuts ──
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft' && currentIdx > 0) selectHymn(currentIdx - 1);
  else if (e.key === 'ArrowRight' && currentIdx < DATA.length - 1) selectHymn(currentIdx + 1);
});

init();
</script>
</body>
</html>
